server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Habilita a criação automática de rotas com base nos serviços registrados no Eureka
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Set-Cookie"
              - "X-Session-Id"
            allowCredentials: true
      # Podemos definir rotas manuais aqui posteriormente se necessário
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/auth/**, /usuarios/**
            
        - id: post-service-route
          uri: lb://post-service
          predicates:
            - Path=/posts/**, /api/posts/**

        - id: feed-service-route
          uri: lb://feed-service
          predicates:
            - Path=/api/feed/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
