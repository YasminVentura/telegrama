version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: telegrama-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: telegrama_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telegrama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d telegrama_auth && (psql -U user -d telegrama_auth -tc \"SELECT 1 FROM pg_database WHERE datname = 'telegrama_profile'\" | grep -q 1 || psql -U user -d telegrama_auth -c \"CREATE DATABASE telegrama_profile\")"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Discovery (Eureka)
  service-discovery:
    build:
      context: ./microservices
      dockerfile: service-discovery/Dockerfile
    container_name: telegrama-discovery
    ports:
      - "8761:8761"
    networks:
      - telegrama-network

  # Auth Service
  auth-service:
    build:
      context: ./microservices
      dockerfile: auth-service/Dockerfile
    container_name: telegrama-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/telegrama_auth
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      service-discovery:
        condition: service_started
    networks:
      - telegrama-network

  # User Profile Service
  user-profile-service:
    build:
      context: ./microservices
      dockerfile: user-profile-service/Dockerfile
    container_name: telegrama-user-profile
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/telegrama_profile
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_started
    networks:
      - telegrama-network

  # API Gateway
  api-gateway:
    build:
      context: ./microservices
      dockerfile: api-gateway/Dockerfile
    container_name: telegrama-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      - redis
      - service-discovery
    networks:
      - telegrama-network

  # Post Service
  post-service:
    build:
      context: ./microservices
      dockerfile: post-service/Dockerfile
    container_name: telegrama-post
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/telegrama_posts
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      - mongodb
      - service-discovery
    networks:
      - telegrama-network

  # Banco de dados MongoDB
  mongodb:
    image: mongo:6.0
    container_name: telegrama-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=telegrama_posts
    volumes:
      - mongodb_data:/data/db
    networks:
      - telegrama-network

  # Cache em Memória e Gerenciamento de Sessão (Redis)
  redis:
    image: redis:7-alpine
    container_name: telegrama-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telegrama-network

networks:
  telegrama-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
